name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint + Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    env:
      # Valores fictícios só para o build não falhar por falta de env vars.
      # Vários módulos instanciam clients (Resend, Anthropic) no topo do arquivo,
      # então precisam de uma chave não-vazia já na coleta de page data do build.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      NEXT_PUBLIC_APP_URL: https://app.simplizzia.com.br
      NEXT_PUBLIC_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000001
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
      RESEND_API_KEY: re_placeholder_ci
      ANTHROPIC_API_KEY: sk-ant-placeholder-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
